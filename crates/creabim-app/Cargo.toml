[package]
name = "creabim-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.95"

[features]
live-mcp = []

[dependencies]
# the clipboard's HTML, to paste from Word keeping headings and bold (already in the build via egui)
arboard = { version = "3.6", default-features = false }
creabim-core.workspace = true
creabim-geom.workspace = true
creabim-ifc.workspace = true
creabim-store.workspace = true
creabim-exchange.workspace = true
creabim-render.workspace = true
glam.workspace = true
eframe = "0.36"
bytemuck = { version = "1", features = ["derive"] }
rfd = "0.15"
# pictures traced over (PNG, JPEG), MU18
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde.workspace = true
serde_json.workspace = true
wry = "0.57"
raw-window-handle = "0.6"

# the local time zone, for project time's days and hours
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSCell", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder", "NSUserInterfaceLayout", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSGeometry", "NSString"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
x11-dl = "2.21"
winit = { version = "0.30", default-features = false, features = ["x11"] }

# the .exe's icon (the logo's creabim.ico), embedded when built on Windows
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
